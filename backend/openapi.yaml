  /api/transactions/mark_completed/:
    post:
      operationId: transactions_mark_completed_create
      description: Marks a reserved exchange as completed with atomic locking.
      tags:
      - transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
components:
  schemas:
    Classification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        predicted_material:
          $ref: '#/components/schemas/MaterialEnum'
        confidence:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
        confidence_pct:
          type: integer
          readOnly: true
        overridden:
          type: boolean
        final_material:
          $ref: '#/components/schemas/MaterialEnum'
        model_id:
          type: string
          nullable: true
          maxLength: 255
        raw_labels:
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - confidence
      - confidence_pct
      - created_at
      - final_material
      - id
      - predicted_material
    ClassificationRequest:
      type: object
      properties:
        predicted_material:
          $ref: '#/components/schemas/MaterialEnum'
        confidence:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
        overridden:
          type: boolean
        final_material:
          $ref: '#/components/schemas/MaterialEnum'
        model_id:
          type: string
          nullable: true
          maxLength: 255
        raw_labels:
          nullable: true
      required:
      - confidence
      - final_material
      - predicted_material
    ClassifyRequestRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
          description: Waste material image file
        imageUrl:
          type: string
          format: uri
          minLength: 1
          description: URL to waste material image
    Listing:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        seller_id:
          type: string
          readOnly: true
        seller_name:
          type: string
          readOnly: true
        seller_cluster:
          type: string
          readOnly: true
        verified:
          type: boolean
          readOnly: true
        title:
          type: string
          maxLength: 255
        material:
          $ref: '#/components/schemas/MaterialEnum'
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        price_ngn:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        status:
          $ref: '#/components/schemas/Status09eEnum'
        photo:
          type: string
          format: uri
          nullable: true
        photo_url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 1000
          - type: string
            maxLength: 0
        primary_photo_url:
          type: string
          nullable: true
          readOnly: true
        photo_urls: {}
        all_photos:
          type: array
          items:
            type: string
          readOnly: true
        zone:
          type: string
          maxLength: 100
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        views:
          type: integer
          readOnly: true
        distance:
          type: number
          format: double
          readOnly: true
        co2_saved:
          type: integer
          readOnly: true
        conf:
          type: integer
          readOnly: true
        classification:
          allOf:
          - $ref: '#/components/schemas/Classification'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - all_photos
      - classification
      - co2_saved
      - conf
      - created_at
      - distance
      - id
      - material
