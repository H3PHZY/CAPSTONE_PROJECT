        description: A UUID string identifying this listing.
        required: true
      tags:
      - messages
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/messages/inbox/:
    get:
      operationId: messages_inbox_retrieve
      description: Groups user messages into distinct listing threads.
      tags:
      - messages
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/messages/thread/:
    get:
      operationId: messages_thread_retrieve
      description: Returns messages between the user and counterparty for a listing.
      tags:
      - messages
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/pay/initialize/:
    post:
      operationId: pay_initialize_create
      description: Generates server-side secure reference (ECO-...) and returns authorized
        amount for checkout.
      summary: Initialize Paystack Transaction
      tags:
      - pay
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaystackInitializeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaystackInitializeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaystackInitializeRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/pay/verify/:
    post:
      operationId: pay_verify_create
      description: Verifies payment with Paystack, asserts amount matches database
        price, and updates listing to Sold atomically.
      summary: Verify Paystack Transaction & Fulfill Lot
      tags:
      - pay
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaystackVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaystackVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaystackVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/transactions/:
