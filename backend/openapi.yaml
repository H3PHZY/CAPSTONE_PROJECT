  /api/transactions/mark_agreed/:
    post:
      operationId: transactions_mark_agreed_create
      description: |-
        Seller marks listing as agreed/reserved for a specific buyer.
        Uses database-level row locking (select_for_update) to prevent race conditions.
      tags:
      - transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
